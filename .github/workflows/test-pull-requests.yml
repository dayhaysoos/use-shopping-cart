# For all pull requests made to master, next, dev, react-19 branches, this workflow will:
# - install all dependencies
# - run all tests for the 'use-shopping-cart' workspace with pnpm

name: Tests

on:
  pull_request:
    branches: [master, next, dev, react-19]

jobs:
  test-package:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node_version: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Version Spec of the version to use.  Examples: 12.x, 10.15.1, >=10.15.0
          node-version: ${{ matrix.node_version }}
          # Used to specify a package manager for caching in the default directory. Supported values: npm, yarn, pnpm
          cache: pnpm

      # Install dependencies
      - run: pnpm install --frozen-lockfile
      # Run integration and unit tests
      - run: pnpm --filter use-shopping-cart run test
      # Type-check the library source
      - run: pnpm --filter use-shopping-cart run typecheck
      # Build, then run type tests against the published type definitions
      - run: pnpm --filter use-shopping-cart run build
      - run: pnpm --filter use-shopping-cart run test:types
      - run: pnpm --filter use-shopping-cart run test:dist

  build-package:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Install dependencies
      - run: pnpm install --frozen-lockfile
      # Build package
      - run: pnpm --filter use-shopping-cart run build
      # Lint the packed tarball (publint) and check type resolution (arethetypeswrong)
      - run: pnpm --filter use-shopping-cart run check:package
      # Docs code blocks import only what the built package exports
      - run: pnpm --filter use-shopping-cart run check:docs

  lint-package:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Install dependencies
      - run: pnpm install --frozen-lockfile
      # Lint source code
      - run: pnpm --filter use-shopping-cart run lint
