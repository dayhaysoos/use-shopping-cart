# This workflow runs tests and builds, then publishes to npm on version tags.
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: Node.js Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter use-shopping-cart run test
      - run: pnpm --filter use-shopping-cart run typecheck
      - run: pnpm --filter use-shopping-cart run build
      - run: pnpm --filter use-shopping-cart run test:types
      - run: pnpm --filter use-shopping-cart run test:dist

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter use-shopping-cart run build
      - run: pnpm --filter use-shopping-cart run check:package

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: pnpm
      - run: npm install -g npm@12.2.1
      - run: pnpm install --frozen-lockfile
      - name: Publish to npm
        working-directory: use-shopping-cart
        run: |
          VERSION="$(node -p \"require('./package.json').version\")"
          DIST_TAG="latest"

          if [[ "$VERSION" == *"-"* ]]; then
            DIST_TAG="${VERSION#*-}"
            DIST_TAG="${DIST_TAG%%.*}"
            if [[ "$DIST_TAG" == "rc" ]]; then
              DIST_TAG="next"
            fi
          fi

          echo "Publishing use-shopping-cart@$VERSION with dist-tag: $DIST_TAG"

          PUBLISH_ARGS=()
          if [[ "$DIST_TAG" != "latest" ]]; then
            PUBLISH_ARGS+=(--tag "$DIST_TAG")
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            npm publish --dry-run "${PUBLISH_ARGS[@]}"
          else
            npm publish "${PUBLISH_ARGS[@]}"
          fi

