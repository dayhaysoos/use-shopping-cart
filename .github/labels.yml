documentation:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - README.md
          - use-shopping-cart/README.md

package:
  - changed-files:
      - any-glob-to-any-file: use-shopping-cart/**

tests:
  - changed-files:
      - any-glob-to-any-file:
          - use-shopping-cart/**/*.test.*
          - use-shopping-cart/type-tests/**
